  <path d="M 303 95 Q 292 82 295 70 Q 298 60 303 65 Q 308 60 311 70 Q 314 82 303 95" fill="#f04020"/>
  <path d="M 303 90 Q 296 80 299 72 Q 301 67 303 70 Q 305 67 307 72 Q 310 80 303 90" fill="#f0a020"/>
  <circle cx="300" cy="74" r="2" fill="#0a0a0a"/>
