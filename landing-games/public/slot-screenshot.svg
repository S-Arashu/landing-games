  <!-- Top: Spirit -->
  <circle cx="190" cy="78" r="18" fill="#1a2e3a" stroke="#2d5a7a" stroke-width="1"/>
  <ellipse cx="190" cy="76" rx="10" ry="12" fill="#f5e8c8"/>
  <ellipse cx="190" cy="73" rx="7" ry="5" fill="#2a2a2a"/>
  <circle cx="186" cy="71" r="2" fill="white"/>
