<svg viewBox="0 0 380 260" xmlns="http://www.w3.org/2000/svg" width="380" height="260">
  <!-- Background -->
  <rect width="380" height="260" rx="12" fill="#0d1f0d" stroke="#d4a017" stroke-width="2"/>
